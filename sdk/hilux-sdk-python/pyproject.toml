[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hilux"
version = "0.1.0"
description = "The official Python SDK for the Hilux AI Workforce Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Hilux AI", email = "sdk@hilux.ai" }]
keywords = ["ai", "agents", "autonomous", "workforce", "orchestration"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "grpcio>=1.64.0",
    "grpcio-tools>=1.64.0",
    "structlog>=24.1.0",
    "anyio>=4.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "W", "F", "I", "N", "UP", "ANN"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
